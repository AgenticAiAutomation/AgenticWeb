# Source-disclosure hardening for agenticaiautomation.co
#
# Include inside the agenticaiautomation.co server block:
#
#     include /etc/nginx/snippets/site-hardening.conf;
#
# Install:
#     cp infra/nginx-hardening.conf /etc/nginx/snippets/site-hardening.conf
#     nginx -t && systemctl reload nginx
#
# Why this exists: the site is deployed by pulling this git repository onto the
# box. That means /var/www/agenticai/.git is a complete copy of the source and
# its history sitting inside the deploy directory. Anything that serves files
# from that directory can hand it out — /.git/config names the remote,
# /.git/HEAD plus the packfiles reconstruct the whole tree. Automated scanners
# probe for exactly this path, so it is found by bots long before a person
# thinks to look.
#
# The Flask app itself only serves /static, so today the exposure depends on
# there being no filesystem `root` on this vhost. These rules make that
# guarantee explicit rather than incidental, so a future `root` or `alias`
# directive cannot quietly open it.

# Version control metadata.
location ~ /\.git { deny all; access_log off; log_not_found off; }
location ~ /\.svn { deny all; access_log off; log_not_found off; }
location ~ /\.hg  { deny all; access_log off; log_not_found off; }

# Environment files, editor droppings and dotfiles generally. The negative
# lookahead keeps /.well-known/ reachable, which certbot needs to renew SSL.
location ~ /\.(?!well-known/) { deny all; access_log off; log_not_found off; }

# Python sources and caches. Nothing under /static should ever be executable
# or importable; if one of these is requested, it is reconnaissance.
location ~* \.(py|pyc|pyo|pyd)$ { deny all; access_log off; log_not_found off; }
location ~ /__pycache__/       { deny all; access_log off; log_not_found off; }

# Dependency manifests disclose the exact library versions in use, which is the
# first step in matching the deployment against known CVEs.
location ~* /(requirements\.txt|Pipfile|Pipfile\.lock|poetry\.lock|package\.json|package-lock\.json|yarn\.lock)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Process and deploy config.
location ~* /(Procfile|deploy\.sh|alembic\.ini|\.python-version)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Backups and archives left behind by an interrupted deploy.
location ~* \.(bak|old|orig|save|swp|swo|tmp|sql|zip|tar|tar\.gz|tgz)$ {
    deny all;
    access_log off;
    log_not_found off;
}
